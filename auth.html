<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Webpot — Login / Register</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Core Styles -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth-premium.css" />

  <!-- Google Sign-In -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

  <!-- ===============================
       AUTH CONTAINER
  ================================ -->
  <div class="auth-wrapper">

    <div class="auth-card">

      <!-- Tabs -->
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">LOGIN</button>
        <button class="auth-tab" data-tab="register">REGISTER</button>
      </div>

      <!-- ===============================
           LOGIN
      ================================ -->
      <div class="auth-panel active" id="loginPanel">

        <h2>Welcome Back</h2>

        <input type="email" id="loginEmail" placeholder="Email" />
        <input type="password" id="loginPassword" placeholder="Password" />

        <button id="loginBtn" class="primary-btn">LOGIN</button>

        <div class="divider"><span>OR</span></div>

        <div id="googleLogin"></div>
      </div>

      <!-- ===============================
           REGISTER
      ================================ -->
      <div class="auth-panel" id="registerPanel">

        <h2>Create Account</h2>

        <input type="text" id="registerName" placeholder="Full Name" />
        <input type="email" id="registerEmail" placeholder="Email" />

        <!-- Password -->
        <input
          type="password"
          id="registerPassword"
          placeholder="Password"
          autocomplete="new-password"
        />

        <!-- 🔐 Password Strength Meter -->
        <div class="password-strength-wrapper">
          <div class="strength-bar">
            <span class="strength-fill" id="passwordStrengthFill"></span>
          </div>
          <span class="strength-text" id="passwordStrengthText">
            Enter a password
          </span>
        </div>

        <!-- Confirm Password -->
        <input
          type="password"
          id="registerConfirmPassword"
          placeholder="Confirm Password"
          autocomplete="new-password"
        />

        <!-- Terms Checkbox -->
        <label class="terms-checkbox" id="termsCheckboxWrapper">
          <input type="checkbox" id="agreeTerms" />
          <span>
            I agree to the
            <a href="html/terms.html" target="_blank">Terms & Conditions</a>
            and
            <a href="html/privacy.html" target="_blank">Privacy Policy</a>
          </span>
        </label>

        <button id="registerBtn" class="primary-btn">
          CREATE ACCOUNT
        </button>

        <div class="divider"><span>OR</span></div>

        <div id="googleRegister"></div>
      </div>

    </div>
  </div>

  <!-- ===============================
       SCRIPTS
  ================================ -->
  <script src="js/auth.js"></script>

</body>
</html>
