<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Webpot - Login / Register</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/auth.css">
  <script src="./js/config.js"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-toggle">
      <button id="loginTab" class="active">Login</button>
      <button id="registerTab">Register</button>
    </div>
    <form id="loginForm" class="auth-form">
      <h2>Login</h2>
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" required autocomplete="username">
      <label for="loginPassword">Password</label>
      <input type="password" id="loginPassword" required autocomplete="current-password">
      <button type="submit">Login</button>
      <div id="loginError" class="error-message"></div>
      <div class="google-signin-container">
        <div id="g_id_onload"
          data-client_id="709120008855-p9m39a4h5i728l0kltuhk9r2dme7t192.apps.googleusercontent.com"
          data-context="signin"
          data-ux_mode="popup"
          data-callback="onGoogleSignIn"
          data-auto_prompt="false">
        </div>
        <div class="g_id_signin"
          data-type="standard"
          data-shape="rectangular"
          data-theme="outline"
          data-text="sign_in_with"
          data-size="large"
          data-logo_alignment="left">
        </div>
      </div>
    </form>
    <form id="registerForm" class="auth-form" style="display:none;">
      <h2>Register</h2>
      <label for="registerName">Name</label>
      <input type="text" id="registerName" required autocomplete="name">
      <label for="registerEmail">Email</label>
      <input type="email" id="registerEmail" required autocomplete="username">
      <label for="registerPassword">Password</label>
      <input type="password" id="registerPassword" required autocomplete="new-password">
      <button type="submit">Register</button>
      <div id="registerError" class="error-message"></div>
    </form>
    <div class="auth-back">
      <a href="index.html">&larr; Back to Home</a>
    </div>
  </div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/users.js"></script>
  <script src="./js/script.js"></script>
  <script>
    // Tab toggle logic
    document.getElementById('loginTab').onclick = function(e) {
      e.preventDefault();
      document.getElementById('loginTab').classList.add('active');
      document.getElementById('registerTab').classList.remove('active');
      document.getElementById('loginForm').classList.add('active');
      document.getElementById('registerForm').classList.remove('active');
    };
    document.getElementById('registerTab').onclick = function(e) {
      e.preventDefault();
      document.getElementById('registerTab').classList.add('active');
      document.getElementById('loginTab').classList.remove('active');
      document.getElementById('loginForm').classList.remove('active');
      document.getElementById('registerForm').classList.add('active');
    };
  </script>
</body>
</html>
