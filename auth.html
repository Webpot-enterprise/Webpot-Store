<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webpot - Login / Register</title>

  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/auth.css">

  <style>
    /* Critical inline styles to ensure layout displays */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .auth-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
      padding: 40px 30px;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 2px solid rgba(0, 0, 0, 0.08);
      background: rgba(249, 250, 251, 0.5);
      gap: 0;
      margin-bottom: 30px;
      margin: -40px -30px 30px -30px;
    }

    .auth-tab-btn {
      flex: 1;
      padding: 16px;
      border: none;
      background: transparent;
      font-size: 15px;
      font-weight: 600;
      color: #9ca3af;
      cursor: pointer;
      transition: all 0.3s ease;
      border-bottom: 3px solid transparent;
    }

    .auth-tab-btn.active {
      color: #2563eb;
      border-bottom-color: #2563eb;
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .auth-form h2 {
      color: #1f2937;
      margin-bottom: 20px;
      font-size: 24px;
      font-weight: 700;
    }

    .auth-form input {
      width: 100%;
      padding: 12px 16px;
      margin-bottom: 12px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    .auth-form input:focus {
      outline: none;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .auth-form button {
      width: 100%;
      padding: 12px 16px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 16px;
    }

    .auth-form button:hover {
      background: #1d4ed8;
      transform: translateY(-2px);
    }

    .auth-divider {
      text-align: center;
      margin: 20px 0;
      color: #6b7280;
      font-size: 14px;
    }

    .auth-error-message {
      color: #ef4444;
      font-size: 13px;
      margin-top: 8px;
    }
  </style>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- ✅ SINGLE GOOGLE INITIALIZER (GLOBAL) -->
  <div id="g_id_onload"
    data-client_id="709120008855-p9m39a4h5i728l0kltuhk9r2dme7t192.apps.googleusercontent.com"
    data-callback="onGoogleSignIn"
    data-ux_mode="popup"
    data-auto_prompt="false">
  </div>

  <div class="auth-container">

    <!-- Tabs -->
    <div class="auth-tabs">
      <button id="loginTabBtn" class="auth-tab-btn active" data-tab="login">Login</button>
      <button id="registerTabBtn" class="auth-tab-btn" data-tab="register">Register</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" class="auth-form active">
      <h2>Welcome Back</h2>

      <input id="loginEmail" type="email" placeholder="Email" required>
      <input id="loginPassword" type="password" placeholder="Password" required>

      <button type="submit">Sign In</button>
      <div id="loginError" class="auth-error-message"></div>

      <div class="auth-divider">or</div>

      <!-- ✅ LOGIN GOOGLE BUTTON -->
      <div class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-text="signin_with">
      </div>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" class="auth-form" style="display:none;">
      <h2>Create Account</h2>

      <input id="registerName" type="text" placeholder="Full name" required>
      <input id="registerEmail" type="email" placeholder="Email" required>
      <input id="registerPassword" type="password" placeholder="Password" required>

      <button type="submit">Create Account</button>
      <div id="registerError" class="auth-error-message"></div>

      <div class="auth-divider">or</div>

      <!-- ✅ REGISTER GOOGLE BUTTON -->
      <div class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-text="signup_with">
      </div>
    </form>

  </div>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>

  <script>
    // Tab switching
    document.addEventListener('DOMContentLoaded', function() {
      const loginTabBtn = document.getElementById('loginTabBtn');
      const registerTabBtn = document.getElementById('registerTabBtn');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');

      if (loginTabBtn) {
        loginTabBtn.addEventListener('click', function() {
          loginTabBtn.classList.add('active');
          registerTabBtn.classList.remove('active');
          loginForm.classList.add('active');
          registerForm.classList.remove('active');
        });
      }

      if (registerTabBtn) {
        registerTabBtn.addEventListener('click', function() {
          registerTabBtn.classList.add('active');
          loginTabBtn.classList.remove('active');
          registerForm.classList.add('active');
          loginForm.classList.remove('active');
        });
      }
    });
  </script>
</body>
</html>
