<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webpot - Login / Register</title>

  <link rel="stylesheet" href="./css/auth-premium.css">

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <!-- ✅ SINGLE GOOGLE INITIALIZER (GLOBAL) -->
  <div id="g_id_onload"
    data-client_id="709120008855-p9m39a4h5i728l0kltuhk9r2dme7t192.apps.googleusercontent.com"
    data-callback="onGoogleSignIn"
    data-ux_mode="popup"
    data-auto_prompt="false">
  </div>

  <div class="auth-container">

    <!-- Tabs -->
    <div class="auth-tabs">
      <button id="loginTabBtn" class="auth-tab-btn active" data-tab="login">Login</button>
      <button id="registerTabBtn" class="auth-tab-btn" data-tab="register">Register</button>
    </div>

    <!-- LOGIN -->
    <form id="loginForm" class="auth-form active">
      <h2>Welcome Back</h2>

      <!-- Email & Password Section -->
      <div id="loginCredentialsSection">
        <input id="loginEmail" type="email" placeholder="Email" required>
        <input id="loginPassword" type="password" placeholder="Password" required>

        <button type="submit" id="loginSubmitBtn">Sign In</button>
        <div id="loginError" class="auth-error-message"></div>

        <div class="auth-divider">or</div>

        <!-- ✅ LOGIN GOOGLE BUTTON -->
        <div class="g_id_signin"
          data-type="standard"
          data-size="large"
          data-text="signin_with">
        </div>
      </div>

      <!-- OTP Verification Section (Hidden until triggered) -->
      <div id="loginOtpSection" style="display: none;">
        <h3>Verify Your Identity</h3>
        <p style="text-align: center; color: #999; font-size: 14px; margin-bottom: 20px;">
          We've sent a 6-digit code to your email
        </p>

        <input id="otpInput" type="text" placeholder="Enter 6-digit OTP" maxlength="6" pattern="[0-9]{6}" required style="text-align: center; letter-spacing: 8px; font-size: 20px; font-weight: bold;">

        <button type="button" id="verifyOtpBtn" style="margin-top: 12px;">Verify OTP</button>
        <div id="otpError" class="auth-error-message"></div>

        <!-- Resend OTP -->
        <div style="margin-top: 16px; text-align: center;">
          <button type="button" id="resendOtpBtn" style="background: none; border: none; color: #00d4ff; cursor: pointer; text-decoration: underline; font-size: 14px;">
            Resend OTP
          </button>
          <span id="resendCooldown" style="display: none; color: #999; font-size: 12px; margin-left: 8px;">
            (Wait <span id="cooldownTimer">30</span>s)
          </span>
        </div>

        <!-- Back to login -->
        <button type="button" id="backToLoginBtn" style="margin-top: 16px; background: none; border: none; color: #999; cursor: pointer; font-size: 12px;">
          ← Back to Login
        </button>
      </div>
    </form>

    <!-- REGISTER -->
    <form id="registerForm" class="auth-form">
      <h2>Create Account</h2>

      <input id="registerName" type="text" placeholder="Full name" required>
      <input id="registerEmail" type="email" placeholder="Email" required>
      <input id="registerPassword" type="password" placeholder="Password" required>
      
      <!-- Password Strength Meter -->
      <div style="display: flex; gap: 10px; align-items: center; margin-top: 8px; margin-bottom: 12px;">
        <div style="flex: 1; height: 4px; background: #e5e7eb; border-radius: 2px; overflow: hidden;">
          <div id="passwordStrengthBar" style="width: 0%; height: 100%; transition: width 0.3s ease, background 0.3s ease; background: #ef4444;"></div>
        </div>
        <span id="passwordStrengthText" style="font-size: 12px; color: #666; min-width: 70px; text-align: right;">Strength</span>
      </div>

      <input id="registerConfirmPassword" type="password" placeholder="Confirm Password" required>

      <!-- Terms & Privacy Agreement -->
      <div class="terms-agreement">
        <input id="termsCheckbox" type="checkbox" required>
        <label for="termsCheckbox">
          I agree to the 
          <a id="termsLink" href="#">Terms & Conditions</a> 
          and 
          <a id="privacyLink" href="#">Privacy Policy</a>
        </label>
      </div>

      <button type="submit">Create Account</button>
      <div id="registerError" class="auth-error-message"></div>

      <div class="auth-divider"></div>

      <!-- ✅ REGISTER GOOGLE BUTTON -->
      <div class="g_id_signin"
        data-type="standard"
        data-size="large"
        data-text="signup_with">
      </div>
    </form>

    <!-- Terms Modal -->
    <div id="termsModal" class="auth-modal-overlay" hidden>
      <div class="auth-modal-content">
        <div class="auth-modal-header">
          <h3 id="modalTitle">Terms & Conditions</h3>
          <button type="button" class="auth-modal-close">&times;</button>
        </div>
        <div id="modalBody" class="auth-modal-body"></div>
        <div id="scrollPrompt" class="scroll-prompt">📖 Scroll to the bottom to continue</div>
        <div class="auth-modal-footer">
          <button type="button" id="modalNextBtn" class="auth-modal-btn" disabled>Next: Privacy Policy</button>
        </div>
      </div>
    </div>

  </div>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>

  <script>
    // Tab switching
    document.addEventListener('DOMContentLoaded', function() {
      const loginTabBtn = document.getElementById('loginTabBtn');
      const registerTabBtn = document.getElementById('registerTabBtn');
      const loginForm = document.getElementById('loginForm');
      const registerForm = document.getElementById('registerForm');

      if (loginTabBtn) {
        loginTabBtn.addEventListener('click', function() {
          loginTabBtn.classList.add('active');
          registerTabBtn.classList.remove('active');
          loginForm.classList.add('active');
          registerForm.classList.remove('active');
        });
      }

      if (registerTabBtn) {
        registerTabBtn.addEventListener('click', function() {
          registerTabBtn.classList.add('active');
          loginTabBtn.classList.remove('active');
          registerForm.classList.add('active');
          loginForm.classList.remove('active');
        });
      }
    });
  </script>
</body>
</html>
