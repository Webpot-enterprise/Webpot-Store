<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Authentication - Webpot</title>
    <link rel="stylesheet" href="auth.css">
    <script src="config.js"></script>
</head>
<body class="auth-page">
    <!-- Animated Background -->
    <div class="auth-background">
        <div class="gradient-orb orb-1"></div>
        <div class="gradient-orb orb-2"></div>
        <div class="gradient-orb orb-3"></div>
    </div>

    <!-- Main Container -->
    <div class="auth-container">
        <!-- Logo & Header -->
        <div class="auth-header">
            <div class="auth-logo">
                <span class="logo-icon">⚡</span>
                <span class="logo-text">Webpot</span>
            </div>
            <p class="auth-subtitle">Professional Web Development</p>
        </div>

        <!-- Auth Card -->
        <div class="auth-card">
            <!-- Tab Navigation -->
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login" onclick="switchTab('login')">
                    <span class="tab-label">Sign In</span>
                    <span class="tab-indicator"></span>
                </button>
                <button class="tab-btn" data-tab="register" onclick="switchTab('register')">
                    <span class="tab-label">Create Account</span>
                    <span class="tab-indicator"></span>
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active" onsubmit="handleLogin(event)">
                <div class="form-title">Welcome Back</div>
                
                <div class="form-group">
                    <input type="email" id="loginEmail" class="form-input" required placeholder=" ">
                    <label for="loginEmail" class="form-label">Email Address</label>
                    <span class="form-icon">📧</span>
                </div>

                <div class="form-group">
                    <input type="password" id="loginPassword" class="form-input" required placeholder=" ">
                    <label for="loginPassword" class="form-label">Password</label>
                    <span class="form-icon">🔒</span>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('loginPassword')">👁️</button>
                </div>

                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password" onclick="toggleForgotPassword(event)">Forgot password?</a>
                </div>

                <button type="submit" class="btn-submit">
                    <span class="btn-text">Sign In</span>
                    <span class="btn-loader"></span>
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" class="auth-form" onsubmit="handleRegister(event)">
                <div class="form-title">Create Your Account</div>
                
                <div class="form-group">
                    <input type="text" id="registerName" class="form-input" required placeholder=" ">
                    <label for="registerName" class="form-label">Full Name</label>
                    <span class="form-icon">👤</span>
                </div>

                <div class="form-group">
                    <input type="email" id="registerEmail" class="form-input" required placeholder=" ">
                    <label for="registerEmail" class="form-label">Email Address</label>
                    <span class="form-icon">📧</span>
                </div>

                <div class="form-group">
                    <input type="password" id="registerPassword" class="form-input" required placeholder=" " onchange="updatePasswordStrength(this.value)">
                    <label for="registerPassword" class="form-label">Password</label>
                    <span class="form-icon">🔒</span>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('registerPassword')">👁️</button>
                </div>

                <!-- Password Strength Meter -->
                <div class="password-strength">
                    <div class="strength-bar">
                        <div class="strength-indicator" id="strengthIndicator"></div>
                    </div>
                    <span class="strength-text" id="strengthText">Weak</span>
                </div>

                <div class="form-group">
                    <input type="password" id="registerConfirm" class="form-input" required placeholder=" ">
                    <label for="registerConfirm" class="form-label">Confirm Password</label>
                    <span class="form-icon">🔒</span>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('registerConfirm')">👁️</button>
                </div>

                <button type="submit" class="btn-submit">
                    <span class="btn-text">Create Account</span>
                    <span class="btn-loader"></span>
                </button>
            </form>

            <!-- Divider -->
            <div class="form-divider">
                <span>or continue with</span>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <button type="button" class="btn-social btn-google" id="customGoogleBtn" onclick="triggerGoogleLogin()">
                    <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    <span>Google</span>
                </button>
            </div>

            <!-- Google Identity Services Container -->
            <div id="g_id_onload" 
                 data-client_id=""
                 data-callback="handleGoogleResponse"
                 style="display: none;">
            </div>

            <!-- Terms -->
            <p class="auth-terms">
                By continuing, you agree to our <a href="terms.html" target="_blank">Terms of Service</a> and <a href="privacy.html" target="_blank">Privacy Policy</a>
            </p>
        </div>

        <!-- Link to Home -->
        <div class="auth-footer">
            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
    </div>

    <!-- Google Identity Services Script -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="auth.js"></script>
</body>
</html>
