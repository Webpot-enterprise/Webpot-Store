<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Your Email - Webpot</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 500px;
      text-align: center;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f0f0f0;
      border-top: 4px solid #00d4ff;
      border-radius: 50%;
      margin: 0 auto 20px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .icon {
      width: 60px;
      height: 60px;
      background: #00d4ff;
      border-radius: 50%;
      margin: 0 auto 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      animation: popIn 0.5s ease;
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }
      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    h1 {
      font-size: 28px;
      color: #1a1a1a;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 14px;
      color: #999;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .message-box {
      background: #f5f5f5;
      border-left: 4px solid #00d4ff;
      padding: 20px;
      border-radius: 4px;
      margin-bottom: 30px;
      text-align: left;
    }

    .message-box p {
      font-size: 14px;
      color: #333;
      line-height: 1.6;
    }

    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-primary {
      background: #00d4ff;
      color: #000;
      margin-top: 20px;
    }

    .btn-primary:hover {
      background: #00b8d4;
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0, 212, 255, 0.3);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .error {
      background: #fff3cd;
      border-left-color: #ff6b6b;
      color: #ff6b6b;
      margin-top: 20px;
      display: none;
    }

    .error p {
      color: #ff6b6b;
    }

    .success {
      background: #d4edda;
      border-left-color: #28a745;
      color: #28a745;
      margin-top: 20px;
      display: none;
    }

    .success p {
      color: #28a745;
    }

    .footer {
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #eee;
      font-size: 12px;
      color: #999;
      line-height: 1.6;
    }

    .footer a {
      color: #00d4ff;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px 20px;
      }

      h1 {
        font-size: 24px;
      }

      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div id="loadingSpinner" class="spinner"></div>
    <div id="successIcon" class="icon" style="display: none;">✓</div>
    
    <h1 id="title">Verifying Email</h1>
    <p class="subtitle" id="subtitle">
      Please wait while we verify your email address...
    </p>

    <div id="messageBox" class="message-box">
      <p>We're confirming your email and setting up your account.</p>
    </div>

    <div id="successMessage" class="success" style="display: none;">
      <p><strong>✓ Email verified successfully!</strong></p>
    </div>

    <div id="errorMessage" class="error">
      <p id="errorText">Unable to verify email. Please check the link and try again.</p>
    </div>

    <button id="continueBtn" class="btn btn-primary" style="display: none;" onclick="continueToHome()">
      Continue to Webpot
    </button>

    <div class="footer">
      <p>
        Having trouble? <a href="./auth.html">Back to Login</a>
      </p>
    </div>
  </div>

  <script src="./js/config.js"></script>
  <script src="./js/api.js"></script>

  <script>
    async function verifyEmail() {
      // Extract token from URL
      const params = new URLSearchParams(window.location.search);
      const token = params.get('token');

      if (!token) {
        showError('Invalid verification link. Please check the URL.');
        return;
      }

      try {
        // Step 1: Verify token validity
        const verifyResponse = await apiCall("/auth/verify", {
          method: "POST",
          action: "verifyRegistrationToken",
          body: { token }
        });

        if (!verifyResponse.success) {
          showError(verifyResponse.message || 'Verification link is invalid or expired.');
          return;
        }

        // Step 2: Complete registration
        const completeResponse = await apiCall("/auth/complete", {
          method: "POST",
          action: "completeRegistration",
          body: { token }
        });

        if (!completeResponse.success) {
          showError(completeResponse.message || 'Failed to complete registration.');
          return;
        }

        // Success! Store token and user data
        if (completeResponse.data?.token) {
          localStorage.setItem(API_CONFIG.AUTH_TOKEN_KEY, completeResponse.data.token);
          if (completeResponse.data.user) {
            localStorage.setItem(API_CONFIG.USER_DATA_KEY, JSON.stringify(completeResponse.data.user));
          }
        }

        showSuccess();
      } catch (error) {
        console.error('Verification error:', error);
        showError('An error occurred. Please try again.');
      }
    }

    function showError(message) {
      document.getElementById('loadingSpinner').style.display = 'none';
      document.getElementById('successIcon').style.display = 'none';
      document.getElementById('title').textContent = 'Verification Failed';
      document.getElementById('subtitle').textContent = message;
      document.getElementById('messageBox').style.display = 'none';
      document.getElementById('errorMessage').style.display = 'block';
      document.getElementById('errorText').textContent = message;
    }

    function showSuccess() {
      document.getElementById('loadingSpinner').style.display = 'none';
      document.getElementById('successIcon').style.display = 'flex';
      document.getElementById('title').textContent = 'Account Verified!';
      document.getElementById('subtitle').textContent = 'Your email has been verified and your account is ready to use.';
      document.getElementById('messageBox').style.display = 'none';
      document.getElementById('successMessage').style.display = 'block';
      document.getElementById('continueBtn').style.display = 'inline-block';
    }

    function continueToHome() {
      window.location.href = './index.html';
    }

    // Run verification on page load
    document.addEventListener('DOMContentLoaded', verifyEmail);
  </script>
</body>
</html>
