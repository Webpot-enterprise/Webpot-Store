<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Dashboard | Webpot</title>
    <link rel="stylesheet" href="customer.css">
</head>
<body>
    <div class="customer-container">
        <!-- Header -->
        <header class="top-header">
            <div class="header-content">
                <h1 class="logo">Webpot</h1>
                <nav class="header-nav">
                    <a href="#orders" class="nav-link active" data-section="orders">Orders</a>
                    <a href="#profile" class="nav-link" data-section="profile">Profile</a>
                    <button class="btn-logout" id="logoutBtn">Logout</button>
                </nav>
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Greeting Section -->
            <section class="greeting-section">
                <div class="greeting-card">
                    <h2 id="greetingText">Welcome back!</h2>
                    <p>Manage your orders and account settings</p>
                </div>
            </section>

            <!-- Summary Cards -->
            <section class="summary-section">
                <div class="summary-card">
                    <div class="card-icon">💰</div>
                    <div class="card-content">
                        <div class="card-label">Wallet Balance</div>
                        <div class="card-value" id="walletBalance">$0.00</div>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="card-icon">📦</div>
                    <div class="card-content">
                        <div class="card-label">Active Orders</div>
                        <div class="card-value" id="activeOrdersCount">0</div>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="card-icon">💸</div>
                    <div class="card-content">
                        <div class="card-label">Total Spent</div>
                        <div class="card-value" id="totalSpent">$0.00</div>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="card-icon">🎁</div>
                    <div class="card-content">
                        <div class="card-label">Referral Code</div>
                        <div class="card-value code-display" id="referralCode">-</div>
                    </div>
                </div>
            </section>

            <!-- Orders Section -->
            <section id="orders" class="section active">
                <div class="section-header">
                    <h2>My Orders</h2>
                    <input type="text" id="ordersSearch" class="search-input" placeholder="Search your orders...">
                </div>

                <div class="orders-container" id="ordersContainer">
                    <div class="loading-state">
                        <p>Loading your orders...</p>
                    </div>
                </div>
            </section>

            <!-- Profile Section -->
            <section id="profile" class="section">
                <div class="section-header">
                    <h2>Profile Settings</h2>
                </div>

                <div class="profile-card">
                    <div class="profile-info">
                        <div class="info-row">
                            <label>Name:</label>
                            <span id="profileName">-</span>
                        </div>
                        <div class="info-row">
                            <label>Email:</label>
                            <span id="profileEmail">-</span>
                        </div>
                        <div class="info-row">
                            <label>Phone:</label>
                            <span id="profilePhone">-</span>
                        </div>
                        <div class="info-row">
                            <label>Referral Code:</label>
                            <span id="profileReferralCode" class="code-display">-</span>
                            <button class="btn-copy" onclick="copyToClipboard('profileReferralCode')">Copy</button>
                        </div>
                        <div class="info-row">
                            <label>Wallet Balance:</label>
                            <span id="profileWallet">$0.00</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>&copy; 2026 Webpot. All rights reserved.</p>
        </footer>
    </div>

    <script src="customer.js"></script>
</body>
</html>
